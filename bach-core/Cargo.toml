[package]
name = "bach-core"
version = "0.1.0"
edition = "2021"
description = "Agent adapters and process runner behind Bach (no UI dependencies)"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "sync", "macros", "net", "signal"] }
uuid = { version = "1", features = ["v4"] }
which = "8"
