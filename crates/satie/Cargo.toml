[package]
name = "satie"
version = "0.1.0"
edition = "2021"
description = "A launcher for long-running background processes, reachable over MCP"

[dependencies]
axum = "0.8"
libc = "0.2.189"
rusqlite = { version = "0.37", features = ["bundled"] }
satie-protocol = { path = "../satie-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "sync", "macros", "net", "time"] }
uuid = { version = "1", features = ["v4"] }
