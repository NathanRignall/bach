[package]
name = "bach-core"
version = "0.1.0"
edition = "2021"
description = "Agent adapters, runs, git, storage and Satie behind Bach (no UI or transport)"

[dependencies]
bach-protocol = { path = "../bach-protocol" }
base64 = "0.23"
portable-pty = "0.9"
# Talks to `opencode serve` on loopback; plain HTTP, so no TLS.
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
rusqlite = { version = "0.37", features = ["bundled"] }
satie = { path = "../satie" }
satie-protocol = { path = "../satie-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "sync", "macros", "net", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
which = "8"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.23"
