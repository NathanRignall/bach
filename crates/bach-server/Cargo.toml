[package]
name = "bach-server"
version = "0.1.0"
edition = "2021"
description = "Serves Bach's API over a WebSocket, for using it from a browser or a remote app"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bach-core = { path = "../bach-core" }
bach-protocol = { path = "../bach-protocol" }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
