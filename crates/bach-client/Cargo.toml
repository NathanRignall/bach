[package]
name = "bach-client"
version = "0.1.0"
edition = "2021"
description = "Talks to a Bach backend elsewhere through a command's stdin/stdout (e.g. `ssh host bach-server attach`)"

[dependencies]
bach-protocol = { path = "../bach-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "sync", "macros", "time"] }
