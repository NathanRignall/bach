[package]
name = "bach-tasks"
version = "0.1.0"
edition = "2021"
description = "A launcher for long-running background processes, reachable over MCP"

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2.189"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
bach-tasks-protocol = { path = "../bach-tasks-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "sync", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
uuid = { version = "1", features = ["v4"] }
