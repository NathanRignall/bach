[package]
name = "bach-protocol"
version = "0.1.0"
edition = "2021"
description = "Bach's wire protocol: commands, events and errors, with generated TypeScript"

[dependencies]
satie-protocol = { path = "../satie-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-json-impl"] }
