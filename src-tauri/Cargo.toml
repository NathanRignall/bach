[package]
name = "bach"
version = "0.1.0"
edition = "2021"
description = "A desktop-style UI wrapping Claude Code, Codex and opencode"

# macOS names the app in the Dock after the executable when it runs unbundled (`pnpm tauri dev`).
[[bin]]
name = "Bach"
path = "src/main.rs"

[lib]
name = "bach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
wrappers = ["bach-core/wrappers"]

[dependencies]
bach-client = { path = "../crates/bach-client" }
bach-core = { path = "../crates/bach-core" }
bach-protocol = { path = "../crates/bach-protocol" }
tauri = { version = "2", features = [] }
serde_json = "1"
shlex = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSToolbar", "NSView", "NSWindow"] }
