[package]
name = "bach"
version = "0.1.0"
edition = "2021"
description = "A desktop-style UI wrapping Claude Code, Codex and opencode"

[lib]
name = "bach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bach-core = { path = "../bach-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
